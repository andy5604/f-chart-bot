name: Trade Value Chart Bot

on:
  # Thursdays only, every 30 min, 10:00-23:59 UTC (roughly 6am to 8pm ET).
  # Dedup means it posts at most once, on the first run that sees a new chart.
  schedule:
    - cron: "*/30 10-23 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if this chart was already posted"
        type: boolean
        default: false

# Only one run at a time, so two overlapping runs can't double-post.
concurrency:
  group: chart-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for a new chart
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_POST: ${{ inputs.force }}
        run: python chart_bot.py

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "chart-bot"
            git config user.email "chart-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Posted chart $(python -c 'import json;print(json.load(open("state.json"))["last_stamp"])')"
            git push
          else
            echo "No new chart, state unchanged."
          fi
